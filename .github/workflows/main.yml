
name: Unpack Telekom monitor

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP file not found"
            exit 1
          fi
          mkdir -p /tmp/monitor
          unzip -q "$ZIP_FILE" -d /tmp/monitor
          cp -R /tmp/monitor/telekom_refurbished_monitor/. .
          rm -f "$ZIP_FILE" TTT

      - name: Save extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install Telekom monitor project" || true
          git push
